<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffebee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      position: relative;
    }
    h1 {
      color: #d32f2f;
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .yes-btn, .no-btn {
      padding: 10px 20px;
      font-size: 1.2em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .yes-btn {
      background-color: #4caf50;
      color: white;
    }
    .no-btn {
      background-color: #f44336;
      color: white;
      position: relative;
    }
    .no-btn:hover {
      transform: translate(calc(-50% + 100px), calc(-50% + 100px));
    }
    .heart {
      position: absolute;
      color: red;
      font-size: 24px;
      animation: floatUp 2s linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>You and me, this valentine?</h1>
    <div class="image-container">
      <img src="cat-flowers.gif" alt="Cute Cat" style="width: 100px; height: 100px;">
    </div>
    <p>Hi lovieeeee,</p>
    <p>Di ko alam pero like do you wanna go somewhere kahti sann.</p>
    <div class="buttons">
      <button class="yes-btn" onclick="showHearts()">Yes</button>
      <button class="no-btn">No</button>
    </div>
  </div>

  <script>
    const noBtn = document.querySelector('.no-btn');
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'absolute';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    function showHearts() {
      for (let i = 0; i < 10; i++) {
        let heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.classList.add('heart');
        document.body.appendChild(heart);
        heart.style.left = `${Math.random() * 100}vw`;
        heart.style.top = '50%';
        setTimeout(() => heart.remove(), 2000);
      }
      setTimeout(() => window.location.href = "yes-message.html", 2000);
    }
  </script>
</body>
</html>
